name: 測試

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 單元測試與網址語料
        run: npm test
      - name: 安裝 Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: 實機端對端測試（載入擴充功能，用模擬詐騙網頁）
        run: node test/e2e.mjs test/screenshots
      - name: 上傳截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test/screenshots
