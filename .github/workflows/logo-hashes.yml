name: 更新官網 Logo 指紋
# 每週打開官方網站首頁，算出網站圖示與 Logo 的指紋（src/data/logo-hashes.js），
# 給插件比對「網頁的 Logo 是不是抄官網的」。完成後會觸發「發布網站」，讓已安裝的插件線上更新。

on:
  schedule:
    - cron: '23 18 * * 6' # 每週日 02:23（台灣時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝 Chromium（用來解碼圖片）
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: 建立指紋
        run: node tools/build-logo-hashes.mjs | tee logo-build.log
      - name: 檢查
        run: npm test
      - name: 寫入摘要
        run: |
          { echo '```'; tail -5 logo-build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 提交
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/logo-hashes.js
          if git diff --cached --quiet; then echo "指紋沒有變化"; else git commit -m "更新官網 Logo 指紋 $(date -u +%F)" && git push; fi
