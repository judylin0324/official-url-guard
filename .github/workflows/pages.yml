name: 發布網站（GitHub Pages）
# 手機版簡訊檢查網頁、隱私權政策、官方網站清單 JSON（插件線上更新用）
# 第一次使用前：repo 的 Settings → Pages → Source 選「GitHub Actions」

on:
  push:
    branches: [main]
    paths: ['src/**', 'web/**', 'tools/build-*.mjs', 'manifest.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 測試（官方清單有問題時不發布）
        run: npm test
      - name: 產生網站
        run: node tools/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
