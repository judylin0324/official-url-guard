<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>官網守門員</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body { width: 380px; min-height: 200px; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 16px 4px; }
    header img { width: 24px; height: 24px; }
    header h1 { font-size: 16px; margin: 0; flex: 1; }
    main { padding: 8px 16px 12px; display: grid; gap: 12px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions .btn { flex: 1; }
    section.check { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
    section.check h2 { margin: 0 0 4px; font-size: 14px; }
    section.check p { margin: 0 0 8px; font-size: 12px; }
    .check-row { display: flex; gap: 8px; }
    .check-row textarea { flex: 1; min-width: 0; resize: vertical; min-height: 44px; }
    #manualResult > * + * { margin-top: 6px; }
    #manualResult { margin-top: 10px; }
    #manualResult:empty { display: none; }
    footer { padding: 8px 16px 14px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    footer .spacer { flex: 1; }
  </style>
</head>
<body>
  <header>
    <img src="../../icons/icon-48.png" alt="">
    <h1>官網守門員</h1>
  </header>
  <main>
    <div id="current"><div class="verdict lv-unknown"><div class="title">檢查中…</div></div></div>
    <div class="actions" id="actions"></div>
    <section class="check">
      <h2>先檢查，再點開</h2>
      <p class="muted">收到簡訊、LINE、Email 裡的連結？把整段訊息貼上，不用點開就能檢查。</p>
      <div class="check-row">
        <textarea id="manualInput" rows="2" placeholder="貼上整段簡訊、LINE 訊息或網址" aria-label="要檢查的訊息或網址"></textarea>
        <button class="btn primary" id="manualBtn">檢查</button>
      </div>
      <div id="manualResult"></div>
    </section>
  </main>
  <footer>
    <span id="stats">載入中…</span>
    <span class="spacer"></span>
    <a href="#" id="openOptions">設定</a>
    <a href="https://165.npa.gov.tw/" target="_blank" rel="noopener">165 全民防騙網</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
