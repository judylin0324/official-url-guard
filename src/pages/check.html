<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>檢查連結 - 官網守門員</title>
  <link rel="stylesheet" href="common.css">
  <style>
    main { padding: 16px; display: grid; gap: 12px; max-width: 520px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 8px; }
    header img { width: 24px; height: 24px; }
    header h1 { font-size: 16px; margin: 0; }
    .full { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; color: var(--muted);
      background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
    .btns { display: grid; gap: 8px; }
    .btns .btn { padding: 10px; }
  </style>
</head>
<body>
  <main>
    <header><img src="../../icons/icon-48.png" alt=""><h1>檢查連結（尚未開啟）</h1></header>
    <div id="result"><div class="verdict lv-unknown"><div class="title">檢查中…</div></div></div>
    <div>
      <div class="muted" style="font-size:12px">完整網址</div>
      <div class="full" id="full"></div>
    </div>
    <div class="btns" id="btns"></div>
  </main>
  <script type="module" src="check.js"></script>
</body>
</html>
